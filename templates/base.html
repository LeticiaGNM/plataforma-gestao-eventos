{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Gestão de Eventos{% endblock %}</title>

    <!-- Aplica o tema salvo ANTES de desenhar a página, para não piscar -->
    <script>
        (function () {
            var salvo = localStorage.getItem('tema');
            var preferido = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', salvo || preferido);
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/estilo.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    {% include 'partials/navbar.html' %}

    <main class="container flex-grow-1 py-4">
        {% include 'partials/mensagens.html' %}
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="border-top py-3 mt-auto bg-body-tertiary">
        <div class="container text-center text-body-secondary small">
            Plataforma de Gestão de Eventos &middot; GAC116 - Programação Web &middot; UFLA
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/tema.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
