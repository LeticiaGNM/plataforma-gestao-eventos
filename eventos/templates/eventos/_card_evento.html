<div class="card card-evento h-100 shadow-sm">
    {% if evento.imagem %}
        <img src="{{ evento.imagem.url }}" class="card-img-top imagem-evento" alt="Capa do evento {{ evento.titulo }}">
    {% else %}
        <div class="sem-imagem"><i class="bi bi-calendar-event"></i></div>
    {% endif %}
    <div class="card-body d-flex flex-column">
        <span class="badge text-bg-primary align-self-start mb-2">{{ evento.categoria.nome }}</span>
        <h2 class="h5 card-title">{{ evento.titulo }}</h2>
        <ul class="list-unstyled text-body-secondary small mb-3">
            <li><i class="bi bi-calendar3"></i> {{ evento.data|date:"d/m/Y" }} às {{ evento.horario|time:"H:i" }}</li>
            <li><i class="bi bi-geo-alt"></i> {{ evento.local.nome }}</li>
        </ul>
        <a href="{% url 'detalhe_evento' evento.pk %}" class="btn btn-outline-primary mt-auto">Ver detalhes</a>
    </div>
</div>
