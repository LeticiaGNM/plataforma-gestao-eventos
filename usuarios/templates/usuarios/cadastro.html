{% extends 'base.html' %}

{% block titulo %}Cadastre-se · Gestão de Eventos{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-center"><i class="bi bi-person-plus"></i> Cadastre-se</h1>

                <form method="post">
                    {% csrf_token %}
                    {% for campo in form %}
                        {% include 'partials/campo_form.html' %}
                    {% endfor %}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Criar conta</button>
                    </div>
                </form>

                <p class="text-center mt-3 mb-0">
                    Já tem conta? <a href="{% url 'login' %}">Entrar</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
